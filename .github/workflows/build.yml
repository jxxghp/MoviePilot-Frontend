name: Build Moviepilot-Frontend v3

on:
  workflow_dispatch:
  push:
    branches:
      - v3
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Release version
        id: release_version
        run: |
          frontend_version=$(jq -r '.version' package.json)
          echo "frontend_version=v$frontend_version" >> "$GITHUB_ENV"

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable project Yarn version
        run: |
          corepack enable
          corepack install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Download Icons
        run: |
          pwd
          curl -fsSL --retry 3 "https://github.com/jxxghp/MoviePilot-Plugins/archive/refs/heads/main.zip" | busybox unzip -d /tmp -
          mv /tmp/MoviePilot-Plugins-main/icons public/plugin_icon
          rm -rf /tmp/MoviePilot-Plugins-main

      - name: Build frontend
        id: build_frontend
        run: |
          yarn build
          echo "$frontend_version" > dist/version.txt
          zip -r dist.zip dist

      - name: Generate Changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release_notes.py \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$frontend_version" \
            --source "$GITHUB_SHA" \
            --changelog-only

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.frontend_version }}
          TARGET_SHA: ${{ github.sha }}
          RELEASE_BODY: ${{ env.RELEASE_BODY }}
        run: |
          release_response=$(mktemp)
          release_error=$(mktemp)
          trap 'rm -f "$release_response" "$release_error"' EXIT

          set +e
          gh api --include \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG_NAME}" \
            > "$release_response" 2> "$release_error"
          set -e
          release_status=$(awk 'NR == 1 { print $2; exit }' "$release_response")

          if [ "$release_status" = "200" ]; then
            release_exists=true
          elif [ "$release_status" = "404" ]; then
            release_exists=false
          else
            echo "Unable to query release ${TAG_NAME} (HTTP ${release_status:-unknown})" >&2
            cat "$release_error" >&2
            exit 1
          fi

          git tag -f "$TAG_NAME" "$TARGET_SHA"
          git push --force origin "refs/tags/${TAG_NAME}"

          notes_file=$(mktemp)
          trap 'rm -f "$release_response" "$release_error" "$notes_file"' EXIT
          printf '%s\n' "$RELEASE_BODY" > "$notes_file"
          if [ "$release_exists" = "true" ]; then
            gh release edit "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG_NAME" \
              --notes-file "$notes_file" \
              --draft=false \
              --prerelease=false \
              --latest
            gh release upload "$TAG_NAME" dist.zip \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "$TAG_NAME" \
              --notes-file "$notes_file" \
              --latest \
              dist.zip
          fi
